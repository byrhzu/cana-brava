<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Planilla · Caña Brava</title>
<link rel="icon" href="assets/img/logo-canabrava.png?v=20260922a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =============================================================
   PLANILLA CAÑA BRAVA
   Mismo sistema visual del panel de Sanitarios Ticos: Poppins para
   rótulos, Inter para datos, barra lateral de 240px, radio 20/14,
   cero sombras y cero bordes en las superficies.
   Lo único que cambia es el acento: el verde de Caña Brava.

   REGLA DE SUPERFICIES: un registro lleva tarjeta propia solo si
   cuelga del fondo de la página. Dentro de una tarjeta vuelve a ser
   renglón separado por filete. Nunca caja sobre caja.
   ============================================================= */
:root{
	--sans:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
	--datos:"Inter",system-ui,-apple-system,sans-serif;

	--p-fondo:#f4f7f3;
	--p-sup:#ffffff;
	--p-sup2:#e9efe6;
	--p-txt:#141a12;
	--p-txt2:#424c3d;
	--p-tenue:#78856f;
	--p-linea:rgba(20,26,18,.13);
	--p-barra:#ffffff;
	--p-barra-t:#141a12;
	--p-ctrl:#eef2ec;
	--p-ctrl-bd:rgba(20,26,18,.12);

	--p-acento:#4C8A2E;          /* verde Caña Brava, ajustado para leer sobre blanco */
	--p-acento-t:#3C6E24;
	--p-suave:rgba(76,138,46,.11);
	--p-primario:#3F5E75;        /* segundo color de dato, para que las cifras se distingan */
	--p-prim-suave:rgba(63,94,117,.11);

	--est-ok-bg:#e7f3ea;   --est-ok-tx:#136c3a;
	--est-esp-bg:#f8f0d0;  --est-esp-tx:#736213;
	--est-mal-bg:#fbeae9;  --est-mal-tx:#a82a2a;
	--est-off-bg:#ece9e3;  --est-off-tx:#655c53;

	--e1:.25rem; --e2:.5rem; --e3:.75rem; --e4:1rem; --e5:1.5rem; --e6:2rem;
	--barra:240px;
	--radio:20px;
	--radio-chico:14px;
}
@media (prefers-color-scheme:dark){
	:root:not([data-tema="claro"]){
		--p-fondo:#0b120c;
		--p-sup:#141d15;
		--p-sup2:#1d281e;
		--p-txt:#eaf2e8;
		--p-txt2:#c0cdbc;
		--p-tenue:#8a9a86;
		--p-linea:rgba(255,255,255,.12);
		--p-barra:#121a13;
		--p-barra-t:#eaf2e8;
		--p-ctrl:rgba(255,255,255,.07);
		--p-ctrl-bd:rgba(255,255,255,.14);
		--p-acento:#7FC454;
		--p-acento-t:#9bd474;
		--p-suave:rgba(127,196,84,.15);
		--p-primario:#86a8c0;
		--p-prim-suave:rgba(134,168,192,.16);
		--est-ok-bg:rgba(52,199,123,.16);  --est-ok-tx:#63d69b;
		--est-esp-bg:rgba(226,172,90,.18); --est-esp-tx:#e2ac5a;
		--est-mal-bg:rgba(239,144,132,.16);--est-mal-tx:#ef9084;
		--est-off-bg:rgba(255,255,255,.08);--est-off-tx:#93a1a9;
	}
}

*{box-sizing:border-box}
body{margin:0;background:var(--p-fondo);color:var(--p-txt);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
a{color:inherit}
.num{font-family:var(--datos);font-variant-numeric:tabular-nums;font-weight:600}
:focus-visible{outline:2px solid var(--p-acento);outline-offset:2px;border-radius:4px}

/* ---------- armazón ---------- */
.app{display:flex;min-height:100vh}
.barra{width:var(--barra);flex:0 0 var(--barra);background:var(--p-barra);color:var(--p-barra-t);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:var(--e5) var(--e3)}
.barra-logo{display:flex;align-items:center;gap:.6rem;padding:0 var(--e3) var(--e5);font-weight:600}
.barra-logo img{height:30px;width:auto;border-radius:6px}
.barra-logo span{font-size:.9rem;line-height:1.15}
.barra-logo small{display:block;color:var(--p-tenue);font-weight:400;font-size:.74rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;padding:.62rem var(--e3);border-radius:var(--radio-chico);color:var(--p-txt2);font-size:.92rem;transition:background .15s,color .15s}
.nav button:hover{background:var(--p-ctrl);color:var(--p-txt)}
.nav button[aria-current="page"]{background:var(--p-suave);color:var(--p-acento-t);font-weight:600}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.barra-pie{margin-top:auto;padding:var(--e3);color:var(--p-tenue);font-size:.74rem}

.lienzo{flex:1;min-width:0;padding:var(--e5) clamp(1rem,2.6vw,2rem) 4rem}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--e4);flex-wrap:wrap;margin-bottom:var(--e5)}
.top h1{font-size:1.55rem}
.top p{margin:.2rem 0 0;color:var(--p-tenue);font-size:.9rem}

/* selector de local */
.locales{display:flex;gap:4px;background:var(--p-ctrl);padding:4px;border-radius:999px;flex-wrap:wrap}
.locales button{padding:.42rem .95rem;border-radius:999px;font-size:.86rem;color:var(--p-txt2);white-space:nowrap}
.locales button[aria-pressed="true"]{background:var(--p-sup);color:var(--p-acento-t);font-weight:600}

/* ---------- superficies ---------- */
.tarj{background:var(--p-sup);border-radius:var(--radio);padding:var(--e5)}
.tarj+.tarj{margin-top:var(--e4)}
.tarj-cab{display:flex;align-items:baseline;justify-content:space-between;gap:var(--e4);flex-wrap:wrap;margin-bottom:var(--e4)}
.tarj-cab h2{font-size:1.05rem}
.tarj-cab p{margin:0;color:var(--p-tenue);font-size:.84rem}

.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--e3)}
.cifra{background:var(--p-sup);border-radius:var(--radio);padding:var(--e4) var(--e5)}
.cifra dt{margin:0 0 .3rem;font-size:.8rem;color:var(--p-tenue)}
.cifra dd{margin:0;font-family:var(--datos);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cifra.acento dd{color:var(--p-acento-t)}
.cifra small{display:block;margin-top:.2rem;font-size:.76rem;color:var(--p-tenue);font-weight:400;font-family:var(--sans)}

/* ---------- tabla ---------- */
.tabla-env{overflow-x:auto;margin:0 calc(var(--e5) * -1);padding:0 var(--e5)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-family:var(--sans);font-size:.68rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--p-tenue);text-align:left;padding:0 .7rem .6rem;white-space:nowrap}
td{padding:.72rem .7rem;border-top:1px solid var(--p-linea);vertical-align:middle}
tbody tr:hover td{background:var(--p-sup2)}
td.n{text-align:right;font-family:var(--datos);font-variant-numeric:tabular-nums}
th.n{text-align:right}
.nombre{font-weight:500}
.nombre small{display:block;color:var(--p-tenue);font-weight:400;font-size:.78rem;font-family:var(--datos)}
tfoot td{border-top:2px solid var(--p-linea);font-weight:700;font-family:var(--datos)}

/* ---------- controles ---------- */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;height:36px;padding:0 .95rem;border-radius:var(--radio-chico);background:var(--p-ctrl);color:var(--p-txt);font-size:.87rem;font-weight:500;transition:background .15s,color .15s}
.bt:hover{background:var(--p-sup2)}
.bt.fuerte{background:var(--p-acento);color:#fff}
.bt.fuerte:hover{background:var(--p-acento-t)}
.bt.chico{height:31px;padding:0 .7rem;font-size:.82rem}
.bt[disabled]{opacity:.45;cursor:not-allowed}
.bt svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.campo{display:block;margin-bottom:var(--e3)}
.campo span{display:block;margin-bottom:.25rem;font-size:.8rem;color:var(--p-txt2)}
.campo input,.campo select{width:100%;height:38px;padding:0 .7rem;border-radius:var(--radio-chico);border:1px solid var(--p-ctrl-bd);background:var(--p-ctrl);font-family:var(--datos);font-size:.92rem}
.campo input:focus,.campo select:focus{outline:2px solid var(--p-acento);outline-offset:1px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 var(--e4)}
.mini{width:88px;height:31px;padding:0 .5rem;border-radius:9px;border:1px solid var(--p-ctrl-bd);background:var(--p-ctrl);font-family:var(--datos);font-size:.86rem;text-align:right}

.et{display:inline-flex;align-items:center;gap:.3rem;padding:.17rem .55rem;border-radius:999px;font-size:.76rem;font-weight:500}
.et.ok{background:var(--est-ok-bg);color:var(--est-ok-tx)}
.et.esp{background:var(--est-esp-bg);color:var(--est-esp-tx)}
.et.mal{background:var(--est-mal-bg);color:var(--est-mal-tx)}
.et.off{background:var(--est-off-bg);color:var(--est-off-tx)}

.vacio{text-align:center;padding:var(--e6) var(--e4);color:var(--p-tenue)}
.vacio h3{margin-bottom:.35rem;color:var(--p-txt2);font-size:1rem}
.vacio p{margin:0 0 var(--e4);font-size:.9rem}

/* ---------- hoja lateral ---------- */
.velo{position:fixed;inset:0;z-index:60;background:rgba(10,15,10,.5);display:none}
.velo.abierto{display:block}
.hoja{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:61;background:var(--p-sup);padding:var(--e5);overflow-y:auto;transform:translateX(100%);transition:transform .28s cubic-bezier(.3,.8,.3,1)}
.hoja.abierta{transform:none}
.hoja-cab{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--e4)}
.hoja-cab h2{font-size:1.15rem}
.hoja-pie{display:flex;gap:var(--e2);margin-top:var(--e5);padding-top:var(--e4);border-top:1px solid var(--p-linea)}

/* boleta */
.boleta{background:var(--p-sup2);border-radius:var(--radio-chico);padding:var(--e4);font-family:var(--datos);font-size:.88rem}
.boleta h4{margin:0 0 .6rem;font-family:var(--sans);font-size:.95rem}
.boleta .fila{display:flex;justify-content:space-between;gap:1rem;padding:.3rem 0}
.boleta .fila+.fila{border-top:1px solid var(--p-linea)}
.boleta .fila.total{margin-top:.3rem;border-top:2px solid var(--p-linea);font-weight:700}
.boleta .resta{color:var(--est-mal-tx)}

.aviso{display:flex;gap:.6rem;background:var(--p-suave);color:var(--p-acento-t);border-radius:var(--radio-chico);padding:.7rem .9rem;font-size:.85rem;margin-bottom:var(--e4)}

/* ---------- teléfono ---------- */
@media (max-width:860px){
	.app{flex-direction:column}
	.barra{position:fixed;left:.6rem;right:.6rem;top:auto;bottom:calc(.5rem + env(safe-area-inset-bottom));width:auto;flex:none;height:auto;flex-direction:row;z-index:30;padding:.3rem;border-radius:999px;background:var(--p-barra);box-shadow:0 8px 28px -10px rgba(0,0,0,.35)}
	.barra-logo,.barra-pie{display:none}
	.nav{flex-direction:row;width:100%;gap:0}
	.nav button{flex-direction:column;gap:.15rem;justify-content:center;padding:.4rem .2rem;font-size:.64rem;border-radius:999px}
	.nav button span{font-size:.64rem}
	.lienzo{padding:var(--e4) var(--e3) 6rem}
	.tarj{padding:var(--e4)}
	.tabla-env{margin:0 calc(var(--e4) * -1);padding:0 var(--e4)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
	<aside class="barra">
		<div class="barra-logo">
			<img src="assets/img/logo-canabrava.png?v=20260922a" alt="">
			<span>Planilla<small>Caña Brava</small></span>
		</div>
		<nav class="nav" id="nav">
			<button type="button" data-ir="quincena" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h10"/></svg><span>Quincena</span></button>
			<button type="button" data-ir="empleados"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M17 11h4M19 9v4"/></svg><span>Empleados</span></button>
			<button type="button" data-ir="historial"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/></svg><span>Historial</span></button>
			<button type="button" data-ir="reportes"><svg viewBox="0 0 24 24"><path d="M5 20V9M12 20V4M19 20v-7"/></svg><span>Reportes</span></button>
			<button type="button" data-ir="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10l1.4 1.4m0-12.8l-1.4 1.4m-10 10l-1.4 1.4"/></svg><span>Ajustes</span></button>
		</nav>
		<div class="barra-pie">
			Los datos se guardan en este dispositivo.<br>Versión de prueba.
		</div>
	</aside>

	<main class="lienzo" id="lienzo"></main>
</div>

<div class="velo" id="velo"></div>
<aside class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-tit">
	<div class="hoja-cab">
		<h2 id="hoja-tit">Empleado</h2>
		<button class="bt chico" type="button" id="hoja-x">Cerrar</button>
	</div>
	<div id="hoja-cuerpo"></div>
</aside>

<script>
(function(){
'use strict';

/* =============================================================
   1. DATOS
   Por ahora se guardan en este dispositivo (localStorage). La forma
   del objeto ya es la de una base de datos, así que mudarlo a D1 de
   Cloudflare —como el panel de Sanitarios— es cambiar solo estas
   cuatro funciones de abajo.
   ============================================================= */
var LLAVE = 'cb_planilla_v1';

var PORDEFECTO = {
	locales: [
		{ id:'gua', nombre:'Restaurante Guácimo',  activo:true },
		{ id:'gpl', nombre:'Restaurante Guápiles', activo:true },
		{ id:'pg1', nombre:'Pollo Guácimo',        activo:true },
		{ id:'pg2', nombre:'Pollo Guápiles',       activo:true }
	],
	empleados: [],
	periodos: {},
	tasas: {
		sem: 5.50,
		ivm: 4.33,
		bp: 1.00,
		patronal: 26.83,
		rentaExento: 918000,
		tramos: [
			{ hasta: 1347000, pct: 10 },
			{ hasta: 2364000, pct: 15 },
			{ hasta: 4727000, pct: 20 },
			{ hasta: Infinity, pct: 25 }
		],
		creditoHijo: 1710,
		creditoConyuge: 2590
	}
};

var D;
function cargar(){
	try { D = JSON.parse(localStorage.getItem(LLAVE)) || null; } catch(e){ D = null; }
	if (!D) D = JSON.parse(JSON.stringify(PORDEFECTO).replace('Infinity','1e15'));
	if (!D.tasas) D.tasas = PORDEFECTO.tasas;
	/* Infinity no sobrevive a JSON: se repone al cargar. */
	D.tasas.tramos[D.tasas.tramos.length-1].hasta = Infinity;
	return D;
}
function guardar(){
	var copia = JSON.parse(JSON.stringify(D, function(k,v){ return v === Infinity ? 1e15 : v; }));
	try { localStorage.setItem(LLAVE, JSON.stringify(copia)); } catch(e){}
}
cargar();

/* =============================================================
   2. EL CÁLCULO
   Todo se calcula POR MES y después se parte en dos quincenas
   iguales. La CCSS y la renta son mensuales; repartirlas por
   quincena daría números distintos.
   ============================================================= */

function horaOrdinaria(salarioMensual){
	/* El divisor de ley para salario mensual: mes de 30 días,
	   jornada de 8 horas. */
	return salarioMensual / 30 / 8;
}

function renta(brutoMes, hijos, conyuge, t){
	if (brutoMes <= t.rentaExento) return 0;
	var impuesto = 0, piso = t.rentaExento;
	for (var i=0; i<t.tramos.length; i++){
		var tr = t.tramos[i];
		if (brutoMes > piso){
			var tope = Math.min(brutoMes, tr.hasta);
			impuesto += (tope - piso) * tr.pct / 100;
			piso = tr.hasta;
		}
	}
	var credito = (hijos || 0) * t.creditoHijo + (conyuge ? t.creditoConyuge : 0);
	return Math.max(0, impuesto - credito);
}

function calcular(emp, ajuste){
	var t = D.tasas;
	ajuste = ajuste || {};
	var base = Number(emp.salarioMensual) || 0;

	var horasExtra = Number(ajuste.horasExtra) || 0;
	var montoExtra = horasExtra * horaOrdinaria(base) * 1.5;
	var otrosIngresos = Number(ajuste.otrosIngresos) || 0;

	var bruto = base + montoExtra + otrosIngresos;

	var sem = bruto * t.sem / 100;
	var ivm = bruto * t.ivm / 100;
	var bp  = bruto * t.bp  / 100;
	var ccss = sem + ivm + bp;

	var imp = renta(bruto, emp.hijos, emp.conyuge, t);
	var adelanto = Number(ajuste.adelanto) || 0;
	var otrasDed = Number(ajuste.otrasDeducciones) || 0;

	var deducciones = ccss + imp + adelanto + otrasDed;
	var neto = bruto - deducciones;

	return {
		base: base, horasExtra: horasExtra, montoExtra: montoExtra,
		otrosIngresos: otrosIngresos, bruto: bruto,
		sem: sem, ivm: ivm, bp: bp, ccss: ccss, renta: imp,
		adelanto: adelanto, otrasDed: otrasDed,
		deducciones: deducciones, neto: neto,
		q1: Math.round(neto / 2), q2: neto - Math.round(neto / 2),
		costoPatronal: bruto * t.patronal / 100,
		costoTotal: bruto + bruto * t.patronal / 100
	};
}

/* =============================================================
   3. UTILIDADES
   ============================================================= */
var $ = function(s, c){ return (c||document).querySelector(s); };
var col = function(n){ return '₡' + Math.round(n||0).toLocaleString('es-CR'); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];

var estado = {
	pantalla: 'quincena',
	local: D.locales[0] ? D.locales[0].id : null,
	periodo: (function(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })()
};

function nombreMes(p){ var a=p.split('-'); return MESES[Number(a[1])-1] + ' ' + a[0]; }
function empleadosDe(localId){
	return D.empleados.filter(function(e){ return e.localId === localId && e.activo !== false; });
}
function ajustesDe(periodo, localId){
	D.periodos[periodo] = D.periodos[periodo] || {};
	D.periodos[periodo][localId] = D.periodos[periodo][localId] || { cerrado:false, ajustes:{} };
	return D.periodos[periodo][localId];
}

/* =============================================================
   4. PANTALLAS
   ============================================================= */
function selectorLocales(){
	var botones = D.locales.filter(function(l){ return l.activo !== false; }).map(function(l){
		return '<button type="button" data-local="'+l.id+'" aria-pressed="'+(estado.local===l.id)+'">'+esc(l.nombre)+'</button>';
	}).join('');
	var todos = '<button type="button" data-local="_todos" aria-pressed="'+(estado.local==='_todos')+'">Los cuatro</button>';
	return '<div class="locales">'+botones+todos+'</div>';
}

function pantallaQuincena(){
	var per = ajustesDe(estado.periodo, estado.local);
	var locales = estado.local === '_todos'
		? D.locales.filter(function(l){ return l.activo !== false; }).map(function(l){ return l.id; })
		: [estado.local];

	var filas = '', totBruto=0, totDed=0, totNeto=0, totPat=0, n=0;
	locales.forEach(function(lid){
		var p = ajustesDe(estado.periodo, lid);
		empleadosDe(lid).forEach(function(e){
			var c = calcular(e, p.ajustes[e.id]);
			totBruto += c.bruto; totDed += c.deducciones; totNeto += c.neto; totPat += c.costoPatronal; n++;
			var localNom = (D.locales.find(function(l){return l.id===lid;})||{}).nombre || '';
			filas += '<tr data-emp="'+e.id+'" data-local="'+lid+'">'
				+ '<td class="nombre">'+esc(e.nombre)+'<small>'+esc(e.cedula||'sin cédula')
				+ (estado.local==='_todos' ? ' · '+esc(localNom) : '')+'</small></td>'
				+ '<td class="n">'+col(c.base)+'</td>'
				+ '<td class="n"><input class="mini" type="number" min="0" step="0.5" data-campo="horasExtra" value="'+(c.horasExtra||'')+'" placeholder="0" aria-label="Horas extra de '+esc(e.nombre)+'"></td>'
				+ '<td class="n"><input class="mini" type="number" min="0" step="1000" data-campo="adelanto" value="'+(c.adelanto||'')+'" placeholder="0" aria-label="Adelanto de '+esc(e.nombre)+'"></td>'
				+ '<td class="n">'+col(c.bruto)+'</td>'
				+ '<td class="n">−'+col(c.deducciones)+'</td>'
				+ '<td class="n"><strong>'+col(c.neto)+'</strong></td>'
				+ '<td class="n">'+col(c.q1)+' · '+col(c.q2)+'</td>'
				+ '<td><button class="bt chico" type="button" data-boleta="'+e.id+'" data-l="'+lid+'">Boleta</button></td>'
				+ '</tr>';
		});
	});

	var cuerpo;
	if (!n){
		cuerpo = '<div class="vacio"><h3>Todavía no hay empleados aquí</h3>'
			+ '<p>Agregá el primero y la planilla se calcula sola.</p>'
			+ '<button class="bt fuerte" type="button" data-ir="empleados">Ir a Empleados</button></div>';
	} else {
		cuerpo = '<div class="tabla-env"><table>'
			+ '<thead><tr><th>Empleado</th><th class="n">Salario</th><th class="n">H. extra</th>'
			+ '<th class="n">Adelanto</th><th class="n">Bruto</th><th class="n">Deducciones</th>'
			+ '<th class="n">Neto del mes</th><th class="n">1.ª · 2.ª quincena</th><th></th></tr></thead>'
			+ '<tbody>'+filas+'</tbody>'
			+ '<tfoot><tr><td>'+n+' empleados</td><td></td><td></td><td></td>'
			+ '<td class="n">'+col(totBruto)+'</td><td class="n">−'+col(totDed)+'</td>'
			+ '<td class="n">'+col(totNeto)+'</td><td class="n">'+col(Math.round(totNeto/2))+' · '+col(totNeto-Math.round(totNeto/2))+'</td><td></td></tr></tfoot>'
			+ '</table></div>';
	}

	return '<div class="top"><div><h1>Quincena</h1><p>'+nombreMes(estado.periodo)+'</p></div>'
		+ '<div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">'
		+ '<button class="bt chico" type="button" id="mes-ant">← Mes anterior</button>'
		+ '<button class="bt chico" type="button" id="mes-sig">Mes siguiente →</button>'
		+ selectorLocales() + '</div></div>'

		+ '<dl class="cifras" style="margin:0 0 var(--e4)">'
		+ '<div class="cifra"><dt>Neto a pagar en el mes</dt><dd>'+col(totNeto)+'</dd><small>'+col(Math.round(totNeto/2))+' en cada quincena</small></div>'
		+ '<div class="cifra"><dt>Deducciones de ley</dt><dd>'+col(totDed)+'</dd><small>CCSS, Banco Popular y renta</small></div>'
		+ '<div class="cifra acento"><dt>Le cuesta a la empresa</dt><dd>'+col(totBruto+totPat)+'</dd><small>bruto + '+D.tasas.patronal+' % patronal</small></div>'
		+ '<div class="cifra"><dt>Empleados en planilla</dt><dd>'+n+'</dd><small>'+(estado.local==='_todos'?'los cuatro locales':'este local')+'</small></div>'
		+ '</dl>'

		+ '<section class="tarj"><div class="tarj-cab"><h2>Detalle del mes</h2>'
		+ '<p>Las horas extra y los adelantos se escriben aquí mismo.</p></div>'
		+ cuerpo + '</section>';
}

function pantallaEmpleados(){
	var lista = estado.local === '_todos'
		? D.empleados
		: D.empleados.filter(function(e){ return e.localId === estado.local; });

	var filas = lista.map(function(e){
		var localNom = (D.locales.find(function(l){return l.id===e.localId;})||{}).nombre || '—';
		return '<tr>'
			+ '<td class="nombre">'+esc(e.nombre)+'<small>'+esc(e.cedula||'sin cédula')+'</small></td>'
			+ '<td>'+esc(e.puesto||'—')+'</td>'
			+ '<td>'+esc(localNom)+'</td>'
			+ '<td class="n">'+col(e.salarioMensual)+'</td>'
			+ '<td>'+esc(e.correo||'—')+'</td>'
			+ '<td>'+(e.activo===false?'<span class="et off">Inactivo</span>':'<span class="et ok">Activo</span>')+'</td>'
			+ '<td><button class="bt chico" type="button" data-editar="'+e.id+'">Abrir</button></td>'
			+ '</tr>';
	}).join('');

	var cuerpo = lista.length
		? '<div class="tabla-env"><table><thead><tr><th>Empleado</th><th>Puesto</th><th>Local</th>'
			+ '<th class="n">Salario</th><th>Correo</th><th>Estado</th><th></th></tr></thead><tbody>'+filas+'</tbody></table></div>'
		: '<div class="vacio"><h3>Sin empleados</h3><p>Agregá el primero para empezar.</p></div>';

	return '<div class="top"><div><h1>Empleados</h1><p>Los inactivos no se borran: salen de la planilla pero conservan su historial.</p></div>'
		+ '<div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">'
		+ selectorLocales()
		+ '<button class="bt fuerte" type="button" id="nuevo-emp">Agregar empleado</button></div></div>'
		+ '<section class="tarj">'+cuerpo+'</section>';
}

function pantallaHistorial(){
	var periodos = Object.keys(D.periodos).sort().reverse();
	var filas = periodos.map(function(p){
		var locales = D.periodos[p];
		return Object.keys(locales).map(function(lid){
			var l = D.locales.find(function(x){return x.id===lid;});
			if (!l) return '';
			var pp = locales[lid];
			var tot = empleadosDe(lid).reduce(function(s,e){ return s + calcular(e, pp.ajustes[e.id]).neto; }, 0);
			return '<tr><td class="nombre">'+nombreMes(p)+'<small>'+esc(l.nombre)+'</small></td>'
				+ '<td class="n">'+col(tot)+'</td>'
				+ '<td>'+(pp.cerrado?'<span class="et ok">Cerrada</span>':'<span class="et esp">Abierta</span>')+'</td>'
				+ '<td>'+(pp.enviado?'<span class="et ok">Enviada</span>':'<span class="et off">Sin enviar</span>')+'</td></tr>';
		}).join('');
	}).join('');

	return '<div class="top"><div><h1>Historial</h1><p>Lo cerrado no se edita. Si hay que corregir, se hace un ajuste en el mes siguiente.</p></div></div>'
		+ '<section class="tarj">'
		+ (filas
			? '<div class="tabla-env"><table><thead><tr><th>Período</th><th class="n">Neto pagado</th><th>Estado</th><th>Boletas</th></tr></thead><tbody>'+filas+'</tbody></table></div>'
			: '<div class="vacio"><h3>Todavía no hay meses cerrados</h3><p>Cuando cierres una quincena va a aparecer acá.</p></div>')
		+ '</section>';
}

function pantallaReportes(){
	var locales = D.locales.filter(function(l){ return l.activo !== false; });
	var filas = locales.map(function(l){
		var p = ajustesDe(estado.periodo, l.id);
		var emps = empleadosDe(l.id);
		var b=0, d=0, nt=0, pat=0;
		emps.forEach(function(e){ var c=calcular(e,p.ajustes[e.id]); b+=c.bruto; d+=c.deducciones; nt+=c.neto; pat+=c.costoPatronal; });
		return '<tr><td class="nombre">'+esc(l.nombre)+'<small>'+emps.length+' empleados</small></td>'
			+ '<td class="n">'+col(b)+'</td><td class="n">'+col(d)+'</td>'
			+ '<td class="n">'+col(nt)+'</td><td class="n">'+col(pat)+'</td>'
			+ '<td class="n"><strong>'+col(b+pat)+'</strong></td></tr>';
	}).join('');

	return '<div class="top"><div><h1>Reportes</h1><p>'+nombreMes(estado.periodo)+'</p></div></div>'
		+ '<section class="tarj"><div class="tarj-cab"><h2>Costo por local</h2>'
		+ '<p>El costo real incluye el '+D.tasas.patronal+' % que aporta la empresa encima del bruto.</p></div>'
		+ '<div class="tabla-env"><table><thead><tr><th>Local</th><th class="n">Bruto</th>'
		+ '<th class="n">Deducciones</th><th class="n">Neto</th><th class="n">Patronal</th>'
		+ '<th class="n">Costo total</th></tr></thead><tbody>'+filas+'</tbody></table></div></section>'

		+ '<section class="tarj"><div class="tarj-cab"><h2>Archivo para SICERE</h2></div>'
		+ '<div class="aviso">Pendiente. Es el reporte mensual que se sube a la Caja. Lo armamos cuando el resto esté probado.</div>'
		+ '</section>';
}

function pantallaAjustes(){
	var t = D.tasas;
	var locales = D.locales.map(function(l){
		return '<tr><td class="nombre">'+esc(l.nombre)+'</td>'
			+ '<td>'+(l.activo===false?'<span class="et off">Inactivo</span>':'<span class="et ok">Activo</span>')+'</td>'
			+ '<td class="n">'+D.empleados.filter(function(e){return e.localId===l.id;}).length+'</td>'
			+ '<td><button class="bt chico" type="button" data-local-toggle="'+l.id+'">'+(l.activo===false?'Activar':'Desactivar')+'</button></td></tr>';
	}).join('');

	return '<div class="top"><div><h1>Ajustes</h1></div></div>'

		+ '<section class="tarj"><div class="tarj-cab"><h2>Locales</h2>'
		+ '<button class="bt" type="button" id="nuevo-local">Agregar local</button></div>'
		+ '<div class="tabla-env"><table><thead><tr><th>Nombre</th><th>Estado</th><th class="n">Empleados</th><th></th></tr></thead>'
		+ '<tbody>'+locales+'</tbody></table></div></section>'

		+ '<section class="tarj"><div class="tarj-cab"><h2>Porcentajes del año</h2>'
		+ '<p>Revisalos cada enero: cambian por decreto.</p></div>'
		+ '<div class="aviso">Valores de 2026 tomados de prensa y firmas contables. Antes de pagar con esto, confirmalos en la CCSS y en el decreto de Hacienda.</div>'
		+ '<div class="rejilla">'
		+ campoNum('sem','SEM · salud (%)',t.sem)
		+ campoNum('ivm','IVM · pensión (%)',t.ivm)
		+ campoNum('bp','Banco Popular (%)',t.bp)
		+ campoNum('patronal','Carga patronal (%)',t.patronal)
		+ campoNum('rentaExento','Renta: exento mensual',t.rentaExento)
		+ campoNum('creditoHijo','Crédito por hijo',t.creditoHijo)
		+ campoNum('creditoConyuge','Crédito por cónyuge',t.creditoConyuge)
		+ '</div></section>'

		+ '<section class="tarj"><div class="tarj-cab"><h2>Datos</h2></div>'
		+ '<p style="margin:0 0 var(--e3);color:var(--p-tenue);font-size:.88rem">Todo se guarda en este dispositivo. Descargá una copia de vez en cuando.</p>'
		+ '<div style="display:flex;gap:.5rem;flex-wrap:wrap">'
		+ '<button class="bt" type="button" id="exportar">Descargar copia</button>'
		+ '<button class="bt" type="button" id="importar">Restaurar copia</button>'
		+ '</div></section>';
}

function campoNum(id, et, val){
	return '<label class="campo"><span>'+et+'</span><input type="number" step="0.01" data-tasa="'+id+'" value="'+val+'"></label>';
}

/* =============================================================
   5. HOJA LATERAL
   ============================================================= */
function abrirHoja(titulo, html){
	$('#hoja-tit').textContent = titulo;
	$('#hoja-cuerpo').innerHTML = html;
	$('#hoja').classList.add('abierta');
	$('#velo').classList.add('abierto');
}
function cerrarHoja(){
	$('#hoja').classList.remove('abierta');
	$('#velo').classList.remove('abierto');
}

function fichaEmpleado(id){
	var e = id ? D.empleados.find(function(x){ return x.id===id; }) : null;
	var nuevo = !e;
	e = e || { id:'e'+Date.now(), localId: estado.local==='_todos' ? D.locales[0].id : estado.local,
		nombre:'', cedula:'', correo:'', puesto:'', fechaIngreso:'', salarioMensual:0,
		hijos:0, conyuge:false, cuenta:'', activo:true };

	var ops = D.locales.map(function(l){
		return '<option value="'+l.id+'"'+(l.id===e.localId?' selected':'')+'>'+esc(l.nombre)+'</option>';
	}).join('');

	abrirHoja(nuevo ? 'Nuevo empleado' : e.nombre,
		'<div class="rejilla">'
		+ '<label class="campo"><span>Nombre completo</span><input id="f-nombre" value="'+esc(e.nombre)+'"></label>'
		+ '<label class="campo"><span>Cédula</span><input id="f-cedula" value="'+esc(e.cedula)+'" placeholder="1-2345-6789"></label>'
		+ '<label class="campo"><span>Correo</span><input id="f-correo" type="email" value="'+esc(e.correo)+'" placeholder="para la boleta"></label>'
		+ '<label class="campo"><span>Puesto</span><input id="f-puesto" value="'+esc(e.puesto)+'"></label>'
		+ '<label class="campo"><span>Local</span><select id="f-local">'+ops+'</select></label>'
		+ '<label class="campo"><span>Fecha de ingreso</span><input id="f-ingreso" type="date" value="'+esc(e.fechaIngreso)+'"></label>'
		+ '<label class="campo"><span>Salario mensual</span><input id="f-salario" type="number" step="1000" value="'+(e.salarioMensual||'')+'"></label>'
		+ '<label class="campo"><span>Cuenta o SINPE</span><input id="f-cuenta" value="'+esc(e.cuenta)+'"></label>'
		+ '<label class="campo"><span>Hijos (bajan la renta)</span><input id="f-hijos" type="number" min="0" value="'+(e.hijos||0)+'"></label>'
		+ '<label class="campo"><span>Cónyuge</span><select id="f-conyuge"><option value="0">No</option><option value="1"'+(e.conyuge?' selected':'')+'>Sí</option></select></label>'
		+ '</div>'
		+ '<label class="campo"><span>Estado</span><select id="f-activo">'
		+ '<option value="1"'+(e.activo!==false?' selected':'')+'>Activo</option>'
		+ '<option value="0"'+(e.activo===false?' selected':'')+'>Inactivo</option></select></label>'
		+ '<div class="hoja-pie"><button class="bt fuerte" type="button" id="f-guardar">Guardar</button>'
		+ '<button class="bt" type="button" id="f-cancelar">Cancelar</button></div>');

	$('#f-cancelar').onclick = cerrarHoja;
	$('#f-guardar').onclick = function(){
		var nombre = $('#f-nombre').value.trim();
		if (!nombre){ $('#f-nombre').focus(); return; }
		e.nombre = nombre;
		e.cedula = $('#f-cedula').value.trim();
		e.correo = $('#f-correo').value.trim();
		e.puesto = $('#f-puesto').value.trim();
		e.localId = $('#f-local').value;
		e.fechaIngreso = $('#f-ingreso').value;
		e.salarioMensual = Number($('#f-salario').value) || 0;
		e.cuenta = $('#f-cuenta').value.trim();
		e.hijos = Number($('#f-hijos').value) || 0;
		e.conyuge = $('#f-conyuge').value === '1';
		e.activo = $('#f-activo').value === '1';
		if (nuevo) D.empleados.push(e);
		guardar(); cerrarHoja(); pintar();
	};
}

function verBoleta(empId, localId){
	var e = D.empleados.find(function(x){ return x.id===empId; });
	if (!e) return;
	var p = ajustesDe(estado.periodo, localId);
	var c = calcular(e, p.ajustes[empId]);
	function fila(et, val, resta){
		return '<div class="fila"><span>'+et+'</span><span class="'+(resta?'resta':'')+'">'+(resta?'−':'')+col(val)+'</span></div>';
	}
	abrirHoja('Boleta · '+e.nombre,
		'<div class="boleta">'
		+ '<h4>'+nombreMes(estado.periodo)+'</h4>'
		+ fila('Salario base', c.base)
		+ (c.montoExtra ? fila(c.horasExtra+' h extra', c.montoExtra) : '')
		+ (c.otrosIngresos ? fila('Otros ingresos', c.otrosIngresos) : '')
		+ '<div class="fila total"><span>Bruto</span><span>'+col(c.bruto)+'</span></div>'
		+ '<div style="height:.7rem"></div>'
		+ fila('SEM · salud '+D.tasas.sem+' %', c.sem, true)
		+ fila('IVM · pensión '+D.tasas.ivm+' %', c.ivm, true)
		+ fila('Banco Popular '+D.tasas.bp+' %', c.bp, true)
		+ (c.renta ? fila('Impuesto sobre la renta', c.renta, true) : '')
		+ (c.adelanto ? fila('Adelanto', c.adelanto, true) : '')
		+ (c.otrasDed ? fila('Otras deducciones', c.otrasDed, true) : '')
		+ '<div class="fila total"><span>Neto del mes</span><span>'+col(c.neto)+'</span></div>'
		+ '<div style="height:.7rem"></div>'
		+ fila('1.ª quincena', c.q1)
		+ fila('2.ª quincena', c.q2)
		+ '</div>'
		+ '<div class="aviso" style="margin-top:var(--e4)">El envío por correo se conecta cuando pasemos los datos al servidor.</div>'
		+ '<div class="hoja-pie"><button class="bt" type="button" onclick="window.print()">Imprimir</button>'
		+ '<button class="bt" type="button" id="b-cerrar">Cerrar</button></div>');
	$('#b-cerrar').onclick = cerrarHoja;
}

/* =============================================================
   6. PINTAR Y ESCUCHAR
   ============================================================= */
var PANTALLAS = {
	quincena: pantallaQuincena,
	empleados: pantallaEmpleados,
	historial: pantallaHistorial,
	reportes: pantallaReportes,
	ajustes: pantallaAjustes
};

function pintar(){
	$('#lienzo').innerHTML = PANTALLAS[estado.pantalla]();
	Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function(b){
		if (b.dataset.ir === estado.pantalla) b.setAttribute('aria-current','page');
		else b.removeAttribute('aria-current');
	});
	window.scrollTo(0,0);
}

function moverMes(delta){
	var a = estado.periodo.split('-'), d = new Date(Number(a[0]), Number(a[1])-1+delta, 1);
	estado.periodo = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
	pintar();
}

document.addEventListener('click', function(ev){
	var t = ev.target.closest('button');
	if (!t) return;

	if (t.dataset.ir){ estado.pantalla = t.dataset.ir; pintar(); return; }
	if (t.dataset.local){ estado.local = t.dataset.local; pintar(); return; }
	if (t.id === 'mes-ant'){ moverMes(-1); return; }
	if (t.id === 'mes-sig'){ moverMes(1); return; }
	if (t.id === 'nuevo-emp'){ fichaEmpleado(null); return; }
	if (t.dataset.editar){ fichaEmpleado(t.dataset.editar); return; }
	if (t.dataset.boleta){ verBoleta(t.dataset.boleta, t.dataset.l); return; }
	if (t.id === 'hoja-x'){ cerrarHoja(); return; }

	if (t.dataset.localToggle){
		var l = D.locales.find(function(x){ return x.id===t.dataset.localToggle; });
		if (l){ l.activo = l.activo === false; guardar(); pintar(); }
		return;
	}
	if (t.id === 'nuevo-local'){
		var nom = prompt('Nombre del local');
		if (nom && nom.trim()){
			D.locales.push({ id:'l'+Date.now(), nombre:nom.trim(), activo:true });
			guardar(); pintar();
		}
		return;
	}
	if (t.id === 'exportar'){
		var a = document.createElement('a');
		a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(D, null, 1));
		a.download = 'planilla-cana-brava-' + new Date().toISOString().slice(0,10) + '.json';
		a.click();
		return;
	}
	if (t.id === 'importar'){
		var inp = document.createElement('input');
		inp.type = 'file'; inp.accept = 'application/json';
		inp.onchange = function(){
			var f = inp.files[0]; if (!f) return;
			var r = new FileReader();
			r.onload = function(){
				try { D = JSON.parse(r.result); D.tasas.tramos[D.tasas.tramos.length-1].hasta = Infinity; guardar(); pintar(); }
				catch(e){ alert('Ese archivo no se pudo leer.'); }
			};
			r.readAsText(f);
		};
		inp.click();
		return;
	}
});

/* horas extra, adelantos y porcentajes se guardan al escribir */
document.addEventListener('input', function(ev){
	var el = ev.target;

	if (el.dataset.campo){
		var fila = el.closest('tr');
		var p = ajustesDe(estado.periodo, fila.dataset.local);
		p.ajustes[fila.dataset.emp] = p.ajustes[fila.dataset.emp] || {};
		p.ajustes[fila.dataset.emp][el.dataset.campo] = Number(el.value) || 0;
		guardar();
		clearTimeout(el._t);
		el._t = setTimeout(function(){
			var foco = el.dataset.campo, emp = fila.dataset.emp;
			pintar();
			var nuevo = document.querySelector('tr[data-emp="'+emp+'"] input[data-campo="'+foco+'"]');
			if (nuevo){ nuevo.focus(); nuevo.setSelectionRange(nuevo.value.length, nuevo.value.length); }
		}, 700);
		return;
	}

	if (el.dataset.tasa){
		D.tasas[el.dataset.tasa] = Number(el.value) || 0;
		guardar();
		return;
	}
});

$('#velo').onclick = cerrarHoja;
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') cerrarHoja(); });

pintar();
})();
</script>
</body>
</html>
