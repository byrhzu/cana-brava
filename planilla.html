<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Planilla · Caña Brava</title>
<link rel="icon" href="assets/img/logo-canabrava.png?v=20260922a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =============================================================
   PLANILLA CAÑA BRAVA
   Siempre en claro. Poppins para rótulos, Inter para cifras.
   Barra lateral de 240px, radio 20/14, sin sombras.
   El verde de la marca aparece en líneas y en el acento.

   REGLA DE SUPERFICIES: un registro lleva tarjeta propia solo si
   cuelga del fondo de la página. Dentro de una tarjeta vuelve a ser
   renglón separado por filete. Nunca caja sobre caja.

   PROHIBIDO: mayúsculas con letter-spacing en cualquier parte.
   ============================================================= */
:root{
	--sans:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
	--datos:"Inter",system-ui,-apple-system,sans-serif;

	--fondo:#f4f7f2;
	--sup:#ffffff;
	--sup2:#eef3ec;
	--txt:#141a12;
	--txt2:#45503f;
	--tenue:#7a8673;
	--linea:rgba(20,26,18,.12);
	--verde:#4C8A2E;
	--verde-t:#3C6E24;
	--verde-suave:rgba(76,138,46,.10);
	--verde-linea:rgba(76,138,46,.45);
	--ctrl:#edf1ea;
	--ctrl-bd:rgba(20,26,18,.12);

	--ok-bg:#e7f3ea;  --ok-tx:#136c3a;
	--esp-bg:#f8f0d0; --esp-tx:#6f5d12;
	--mal-bg:#fbeae9; --mal-tx:#a82a2a;
	--off-bg:#ece9e3; --off-tx:#655c53;

	--e1:.25rem; --e2:.5rem; --e3:.75rem; --e4:1rem; --e5:1.5rem; --e6:2rem;
	--barra:240px; --radio:20px; --radio-chico:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px;border-radius:4px}

/* ---------- armazón ---------- */
.app{display:flex;min-height:100vh}
.barra{width:var(--barra);flex:0 0 var(--barra);background:var(--sup);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:var(--e5) var(--e3);border-right:1px solid var(--linea)}
.marca{display:flex;align-items:center;gap:.6rem;padding:0 var(--e3) var(--e5)}
.marca img{height:22px;width:auto}
.marca .caja{background:#0D0F0D;border-radius:9px;padding:6px 8px;display:grid;place-items:center}
.marca .sep{width:1px;height:22px;background:var(--verde-linea)}
.marca b{font-weight:600;font-size:1rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;padding:.62rem var(--e3);border-radius:var(--radio-chico);color:var(--txt2);font-size:.92rem;transition:background .15s,color .15s}
.nav button:hover{background:var(--ctrl);color:var(--txt)}
.nav button[aria-current="page"]{background:var(--verde-suave);color:var(--verde-t);font-weight:600}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.barra-pie{margin-top:auto;padding:var(--e3);color:var(--tenue);font-size:.74rem;border-top:1px solid var(--linea)}

.lienzo{flex:1;min-width:0;padding:var(--e5) clamp(1rem,2.6vw,2rem) 4rem}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--e4);flex-wrap:wrap;margin-bottom:var(--e4)}
.top h1{font-size:1.55rem}

/* ---------- período: mes + quincena ---------- */
.periodo{display:flex;align-items:center;gap:var(--e3);flex-wrap:wrap;padding:var(--e3) 0 var(--e4);border-bottom:2px solid var(--verde-linea);margin-bottom:var(--e5)}
.mes-sel{display:flex;align-items:center;gap:.3rem}
.mes-sel b{font-weight:600;font-size:1.02rem;min-width:9.5rem;text-align:center}
.flecha{width:32px;height:32px;border-radius:10px;background:var(--ctrl);display:grid;place-items:center;font-size:1rem;line-height:1}
.flecha:hover{background:var(--sup2)}
.quincenas{display:flex;gap:4px;background:var(--ctrl);padding:4px;border-radius:999px;margin-left:auto}
.quincenas button{padding:.42rem 1rem;border-radius:999px;font-size:.87rem;color:var(--txt2);white-space:nowrap}
.quincenas button[aria-pressed="true"]{background:var(--sup);color:var(--verde-t);font-weight:600;box-shadow:inset 0 0 0 1px var(--verde-linea)}

/* Selector de sede, en la barra lateral */
.sedes-env{padding-bottom:var(--e4);margin-bottom:var(--e3);border-bottom:1px solid var(--linea)}
.sedes{display:flex;flex-direction:column;gap:1px}
.sedes button{text-align:left;padding:.42rem var(--e3);border-radius:10px;font-size:.88rem;color:var(--txt2);transition:background .15s,color .15s}
.sedes button:hover{background:var(--ctrl);color:var(--txt)}
.sedes button[aria-pressed="true"]{background:var(--verde-suave);color:var(--verde-t);font-weight:600}
.sedes .sede-todas{font-weight:500;margin-bottom:.3rem}
.sedes .sede-grupo{margin:.55rem 0 .15rem;padding:0 var(--e3);font-size:.74rem;color:var(--tenue)}
.sedes-movil{display:none;gap:4px;overflow-x:auto;padding:0 0 var(--e4);scrollbar-width:none}
.sedes-movil::-webkit-scrollbar{display:none}
.sedes-movil button{flex:none;padding:.42rem .9rem;border-radius:999px;background:var(--ctrl);font-size:.84rem;color:var(--txt2);white-space:nowrap}
.sedes-movil button[aria-pressed="true"]{background:var(--verde-suave);color:var(--verde-t);font-weight:600;box-shadow:inset 0 0 0 1px var(--verde-linea)}
.sedes .sede-grupo+button{margin-top:0}

/* ---------- superficies ---------- */
.tarj{background:var(--sup);border-radius:var(--radio);padding:var(--e5)}
.tarj+.tarj{margin-top:var(--e4)}
.tarj-cab{display:flex;align-items:center;justify-content:space-between;gap:var(--e4);flex-wrap:wrap;margin-bottom:var(--e4)}
.tarj-cab h2{font-size:1.05rem}

.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--e3);margin-bottom:var(--e4)}
.cifra{background:var(--sup);border-radius:var(--radio);padding:var(--e4) var(--e5);border-top:3px solid transparent}
.cifra.acento{border-top-color:var(--verde)}
.cifra dt{margin:0 0 .3rem;font-size:.82rem;color:var(--tenue)}
.cifra dd{margin:0;font-family:var(--datos);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cifra small{display:block;margin-top:.2rem;font-size:.78rem;color:var(--tenue);font-weight:400;font-family:var(--sans)}

/* ---------- tabla ---------- */
.tabla-env{overflow-x:auto;margin:0 calc(var(--e5) * -1);padding:0 var(--e5)}
table{border-collapse:collapse;width:100%;min-width:620px}
/* Encabezado en caja normal: nada de mayúsculas espaciadas. */
th{font-family:var(--sans);font-size:.82rem;font-weight:500;color:var(--tenue);text-align:left;padding:0 .7rem .55rem;white-space:nowrap}
td{padding:.72rem .7rem;border-top:1px solid var(--linea);vertical-align:middle}
tbody tr:hover td{background:var(--sup2)}
td.n,th.n{text-align:right}
td.n{font-family:var(--datos);font-variant-numeric:tabular-nums}
.nombre{font-weight:500}
.nombre small{display:block;color:var(--tenue);font-weight:400;font-size:.78rem;font-family:var(--datos)}
tfoot td{border-top:2px solid var(--verde-linea);font-weight:700;font-family:var(--datos)}

/* ---------- controles ---------- */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;height:36px;padding:0 .95rem;border-radius:var(--radio-chico);background:var(--ctrl);color:var(--txt);font-size:.87rem;font-weight:500;transition:background .15s,color .15s}
.bt:hover{background:var(--sup2)}
.bt.fuerte{background:var(--verde);color:#fff}
.bt.fuerte:hover{background:var(--verde-t)}
.bt.chico{height:31px;padding:0 .7rem;font-size:.82rem}
.bt[disabled]{opacity:.45;cursor:not-allowed}

.campo{display:block;margin-bottom:var(--e3)}
.campo span{display:block;margin-bottom:.25rem;font-size:.82rem;color:var(--txt2)}
.campo input,.campo select{width:100%;height:38px;padding:0 .7rem;border-radius:var(--radio-chico);border:1px solid var(--ctrl-bd);background:var(--ctrl);font-family:var(--datos);font-size:.92rem}
.campo input:focus,.campo select:focus{outline:2px solid var(--verde);outline-offset:1px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 var(--e4)}
.mini{width:84px;height:31px;padding:0 .5rem;border-radius:9px;border:1px solid var(--ctrl-bd);background:var(--ctrl);font-family:var(--datos);font-size:.86rem;text-align:right}

.et{display:inline-flex;align-items:center;gap:.3rem;padding:.17rem .55rem;border-radius:999px;font-size:.76rem;font-weight:500}
.et.ok{background:var(--ok-bg);color:var(--ok-tx)}
.et.esp{background:var(--esp-bg);color:var(--esp-tx)}
.et.off{background:var(--off-bg);color:var(--off-tx)}

.vacio{text-align:center;padding:var(--e6) var(--e4);color:var(--tenue)}
.vacio h3{margin-bottom:.35rem;color:var(--txt2);font-size:1rem}
.vacio p{margin:0 0 var(--e4);font-size:.9rem}

/* ---------- hoja lateral ---------- */
.velo{position:fixed;inset:0;z-index:60;background:rgba(20,26,18,.42);display:none}
.velo.abierto{display:block}
.hoja{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);z-index:61;background:var(--sup);padding:var(--e5);overflow-y:auto;transform:translateX(100%);transition:transform .28s cubic-bezier(.3,.8,.3,1);border-left:3px solid var(--verde)}
.hoja.abierta{transform:none}
.hoja-cab{display:flex;align-items:center;justify-content:space-between;gap:var(--e3);margin-bottom:var(--e4)}
.hoja-cab h2{font-size:1.15rem}
.hoja-pie{display:flex;gap:var(--e2);margin-top:var(--e5);padding-top:var(--e4);border-top:1px solid var(--linea);flex-wrap:wrap}
.hoja h3{font-size:.95rem;margin:var(--e5) 0 var(--e2)}

/* boleta */
.boleta{background:var(--sup2);border-radius:var(--radio-chico);padding:var(--e4);font-family:var(--datos);font-size:.88rem;border-left:3px solid var(--verde)}
.boleta .enc{font-family:var(--sans);margin-bottom:var(--e3);padding-bottom:var(--e3);border-bottom:1px solid var(--linea)}
.boleta .enc b{display:block;font-size:1rem}
.boleta .enc span{display:block;color:var(--tenue);font-size:.82rem}
.boleta .fila{display:flex;justify-content:space-between;gap:1rem;padding:.3rem 0}
.boleta .fila+.fila{border-top:1px solid var(--linea)}
.boleta .fila.total{margin-top:.3rem;border-top:2px solid var(--verde-linea);font-weight:700}
.boleta .resta{color:var(--mal-tx)}

.aviso{display:flex;gap:.6rem;background:var(--verde-suave);color:var(--verde-t);border-radius:var(--radio-chico);padding:.7rem .9rem;font-size:.85rem;margin-bottom:var(--e4)}

/* ---------- teléfono ---------- */
@media (max-width:860px){
	.app{flex-direction:column}
	.barra{position:fixed;left:.6rem;right:.6rem;top:auto;bottom:calc(.5rem + env(safe-area-inset-bottom));width:auto;flex:none;height:auto;flex-direction:row;z-index:30;padding:.3rem;border-radius:999px;border:1px solid var(--linea);box-shadow:0 10px 30px -12px rgba(20,26,18,.3)}
	.marca,.barra-pie,.sedes-env{display:none}
	.sedes-movil{display:flex}
	.nav{flex-direction:row;width:100%;gap:0}
	.nav button{flex-direction:column;gap:.15rem;justify-content:center;padding:.4rem .2rem;font-size:.64rem;border-radius:999px}
	.lienzo{padding:var(--e4) var(--e3) 6rem}
	.tarj{padding:var(--e4)}
	.tabla-env{margin:0 calc(var(--e4) * -1);padding:0 var(--e4)}
	.quincenas{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
	<aside class="barra">
		<div class="marca">
			<span class="caja"><img src="assets/img/logo-canabrava.png?v=20260922a" alt="Caña Brava"></span>
			<span class="sep"></span>
			<b>Planilla</b>
		</div>
		<div class="sedes-env" id="sedes-env"></div>
		<nav class="nav" id="nav">
			<button type="button" data-ir="quincena" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h10"/></svg><span>Quincena</span></button>
			<button type="button" data-ir="empleados"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M17 11h4M19 9v4"/></svg><span>Empleados</span></button>
			<button type="button" data-ir="historial"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/></svg><span>Historial</span></button>
			<button type="button" data-ir="reportes"><svg viewBox="0 0 24 24"><path d="M5 20V9M12 20V4M19 20v-7"/></svg><span>Reportes</span></button>
			<button type="button" data-ir="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10l1.4 1.4m0-12.8l-1.4 1.4m-10 10l-1.4 1.4"/></svg><span>Ajustes</span></button>
		</nav>
		<div class="barra-pie">Los datos se guardan en este dispositivo.</div>
	</aside>

	<main class="lienzo" id="lienzo"></main>
</div>

<div class="velo" id="velo"></div>
<aside class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-tit">
	<div class="hoja-cab">
		<h2 id="hoja-tit"></h2>
		<button class="bt chico" type="button" id="hoja-x">Cerrar</button>
	</div>
	<div id="hoja-cuerpo"></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';

/* =============================================================
   1. DATOS
   Viven en este dispositivo. La forma ya es la de una base de datos,
   así que mudarlos al servidor es cambiar cargar() y guardar().
   ============================================================= */
var LLAVE = 'cb_planilla_v2';

var PORDEFECTO = {
	locales: [
		{ id:'cbgpl', grupo:'Caña Brava',  sede:'Guápiles', activo:true },
		{ id:'cbgua', grupo:'Caña Brava',  sede:'Guácimo',  activo:true },
		{ id:'pbgpl', grupo:'Pollo Bravo', sede:'Guápiles', activo:true },
		{ id:'pbgua', grupo:'Pollo Bravo', sede:'Guácimo',  activo:true }
	],
	empleados: [],
	periodos: {},
	tasas: {
		sem:5.50, ivm:4.33, bp:1.00, patronal:26.83,
		rentaExento:918000,
		tramos:[{hasta:1347000,pct:10},{hasta:2364000,pct:15},{hasta:4727000,pct:20},{hasta:1e15,pct:25}]
	}
};

var D;
function cargar(){
	try { D = JSON.parse(localStorage.getItem(LLAVE)) || null; } catch(e){ D = null; }
	if (!D) D = JSON.parse(JSON.stringify(PORDEFECTO));
	if (!D.tasas) D.tasas = JSON.parse(JSON.stringify(PORDEFECTO.tasas));
	if (!D.periodos) D.periodos = {};
}
function guardar(){ try { localStorage.setItem(LLAVE, JSON.stringify(D)); } catch(e){} }
cargar();

/* =============================================================
   2. EL CÁLCULO
   La CCSS y la renta son mensuales, así que se calculan sobre el mes
   completo y se reparten en mitades. Cada quincena lleva además sus
   propias horas extra y adelantos.
   ============================================================= */
function horaOrdinaria(mensual){ return mensual / 30 / 8; }

function renta(brutoMes, t){
	if (brutoMes <= t.rentaExento) return 0;
	var imp = 0, piso = t.rentaExento;
	for (var i=0;i<t.tramos.length;i++){
		var tr = t.tramos[i];
		if (brutoMes > piso){
			imp += (Math.min(brutoMes, tr.hasta) - piso) * tr.pct / 100;
			piso = tr.hasta;
		}
	}
	return Math.max(0, imp);
}

function calcular(emp, aj){
	var t = D.tasas;
	aj = aj || {};
	var q1 = aj.q1 || {}, q2 = aj.q2 || {};
	var base = Number(emp.salarioMensual) || 0;
	var hora = horaOrdinaria(base);

	function extra(q){ return (Number(q.horasExtra)||0) * hora * 1.5; }

	var extraMes = extra(q1) + extra(q2);
	var brutoMes = base + extraMes;

	var sem = brutoMes * t.sem/100, ivm = brutoMes * t.ivm/100, bp = brutoMes * t.bp/100;
	var ccss = sem + ivm + bp;
	var imp = renta(brutoMes, t);
	var dedLey = ccss + imp;

	function quincena(q){
		var brutoQ = base/2 + extra(q);
		var dedLeyQ = dedLey/2;
		var adelanto = Number(q.adelanto)||0;
		var otras = Number(q.otras)||0;
		return {
			horas: Number(q.horasExtra)||0, montoExtra: extra(q),
			base: base/2, bruto: brutoQ,
			sem: sem/2, ivm: ivm/2, bp: bp/2, ccss: ccss/2, renta: imp/2,
			dedLey: dedLeyQ, adelanto: adelanto, otras: otras,
			deducciones: dedLeyQ + adelanto + otras,
			neto: brutoQ - dedLeyQ - adelanto - otras
		};
	}

	var c1 = quincena(q1), c2 = quincena(q2);
	return {
		base: base, brutoMes: brutoMes, ccssMes: ccss, rentaMes: imp,
		netoMes: c1.neto + c2.neto,
		costoPatronal: brutoMes * t.patronal/100,
		q1: c1, q2: c2
	};
}

/* =============================================================
   3. UTILIDADES
   ============================================================= */
var $ = function(s,c){ return (c||document).querySelector(s); };
var col = function(n){ return '₡' + Math.round(n||0).toLocaleString('es-CR'); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];
function nombreMes(p){ var a=p.split('-'); return MESES[Number(a[1])-1] + ' de ' + a[0]; }
function diasQuincena(p,q){
	var a=p.split('-'), m=Number(a[1]), y=Number(a[0]);
	var fin = new Date(y, m, 0).getDate();
	return q===1 ? ('1 al 15 de '+MESES[m-1]) : ('16 al '+fin+' de '+MESES[m-1]);
}

var hoy = new Date();
var estado = {
	pantalla:'quincena',
	local: D.locales[0] ? D.locales[0].id : null,
	periodo: hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0'),
	q: hoy.getDate() <= 15 ? 1 : 2
};

function empleadosDe(id){ return D.empleados.filter(function(e){ return e.localId===id && e.activo!==false; }); }
function nombreLocal(l){
	if (!l) return '—';
	return l.nombre || ((l.grupo?l.grupo+' ':'') + (l.sede||'')).trim() || '—';
}
function localDe(id){ return D.locales.find(function(l){ return l.id===id; }) || {}; }
function per(p,l){
	D.periodos[p] = D.periodos[p] || {};
	D.periodos[p][l] = D.periodos[p][l] || { ajustes:{}, enviado:{} };
	return D.periodos[p][l];
}
function ajusteDe(p,l,empId){
	var pp = per(p,l);
	pp.ajustes[empId] = pp.ajustes[empId] || { q1:{}, q2:{} };
	if (!pp.ajustes[empId].q1) pp.ajustes[empId].q1 = {};
	if (!pp.ajustes[empId].q2) pp.ajustes[empId].q2 = {};
	return pp.ajustes[empId];
}

/* =============================================================
   4. PANTALLAS
   ============================================================= */
function barraPeriodo(){
	return '<div class="periodo">'
		+ '<div class="mes-sel">'
		+ '<button class="flecha" type="button" id="mes-ant" aria-label="Mes anterior">‹</button>'
		+ '<b>'+nombreMes(estado.periodo)+'</b>'
		+ '<button class="flecha" type="button" id="mes-sig" aria-label="Mes siguiente">›</button>'
		+ '</div>'
		+ '<div class="quincenas">'
		+ '<button type="button" data-q="1" aria-pressed="'+(estado.q===1)+'">Quincena 1</button>'
		+ '<button type="button" data-q="2" aria-pressed="'+(estado.q===2)+'">Quincena 2</button>'
		+ '</div></div>';
}

/* El local es el contexto de todo el panel, no un filtro de pantalla:
   por eso vive en la barra lateral y no se repite arriba de cada una.
   Va agrupado por marca, que es como está armado el negocio, y así
   escala si mañana abren otro. */
function selectorLocales(){
	var activos = D.locales.filter(function(l){ return l.activo!==false; });
	var html = '<button class="sede-todas" type="button" data-local="_todos" aria-pressed="'+(estado.local==='_todos')+'">Todas</button>';
	var grupos = [];
	activos.forEach(function(l){
		var g = l.grupo || null, ex = null;
		for (var i=0;i<grupos.length;i++){ if (grupos[i].g === g) ex = grupos[i]; }
		if (ex) ex.items.push(l); else grupos.push({ g:g, items:[l] });
	});
	grupos.forEach(function(gr){
		if (gr.g) html += '<p class="sede-grupo">'+esc(gr.g)+'</p>';
		html += gr.items.map(function(l){
			var et = gr.g ? (l.sede || nombreLocal(l)) : nombreLocal(l);
			return '<button type="button" data-local="'+l.id+'" aria-pressed="'+(estado.local===l.id)+'">'+esc(et)+'</button>';
		}).join('');
	});
	return '<div class="sedes">'+html+'</div>';
}

/* En el teléfono la barra lateral es una pastilla abajo y no cabe el
   selector, así que arriba del contenido va una tira horizontal. */
function selectorLocalesMovil(){
	var b = D.locales.filter(function(l){ return l.activo!==false; }).map(function(l){
		return '<button type="button" data-local="'+l.id+'" aria-pressed="'+(estado.local===l.id)+'">'+esc(nombreLocal(l))+'</button>';
	}).join('');
	return '<div class="sedes-movil"><button type="button" data-local="_todos" aria-pressed="'+(estado.local==='_todos')+'">Todas</button>'+b+'</div>';
}

			+ '<td class="n">'+col(tNeto)+'</td><td></td></tr></tfoot></table></div>'

function pantallaHistorial(){
	var filas = Object.keys(D.periodos).sort().reverse().map(function(p){
		return Object.keys(D.periodos[p]).map(function(lid){
			var l = D.locales.find(function(x){return x.id===lid;});
			if (!l) return '';
			var pp = D.periodos[p][lid];
			return [1,2].map(function(q){
				var tot = empleadosDe(lid).reduce(function(s,e){
					var c = calcular(e, ajusteDe(p,lid,e.id));
					return s + (q===1?c.q1.neto:c.q2.neto);
				},0);
				if (!tot) return '';
				var env = pp.enviado && pp.enviado['q'+q];
				return '<tr><td class="nombre">'+nombreMes(p)+' · quincena '+q+'<small>'+esc(l.nombre)+'</small></td>'
					+ '<td class="n">'+col(tot)+'</td>'
					+ '<td>'+(env?'<span class="et ok">Enviada</span>':'<span class="et esp">Sin enviar</span>')+'</td></tr>';
			}).join('');
		}).join('');
	}).join('');

	return '<div class="top"><h1>Historial</h1></div>'
		+ '<section class="tarj">'
		+ (filas ? '<div class="tabla-env"><table><thead><tr><th>Período</th><th class="n">Neto pagado</th><th>Boletas</th></tr></thead><tbody>'+filas+'</tbody></table></div>'
			: '<div class="vacio"><h3>Todavía no hay quincenas con movimiento</h3></div>')
		+ '</section>';
}

function fichaEmpleado(id){
	var e = id ? D.empleados.find(function(x){return x.id===id;}) : null;
	var nuevo = !e;
	e = e || { id:'e'+Date.now(), localId: estado.local==='_todos'?D.locales[0].id:estado.local,
		nombre:'', cedula:'', correo:'', puesto:'', fechaIngreso:'', salarioMensual:0, cuenta:'', activo:true };

	var ops = D.locales.map(function(l){ return '<option value="'+l.id+'"'+(l.id===e.localId?' selected':'')+'>'+esc(nombreLocal(l))+'</option>'; }).join('');

	/* historial de pagos del empleado */
	var hist = '';
	Object.keys(D.periodos).sort().reverse().forEach(function(p){
		var pp = D.periodos[p][e.localId];
		if (!pp || !pp.ajustes) return;
		var c = calcular(e, ajusteDe(p, e.localId, e.id));
		[1,2].forEach(function(q){
			var qq = q===1?c.q1:c.q2;
			if (!qq.neto) return;
			var env = pp.enviado && pp.enviado['q'+q];
			hist += '<tr><td class="nombre">'+nombreMes(p)+'<small>quincena '+q+'</small></td>'
				+ '<td class="n">'+col(qq.neto)+'</td>'
				+ '<td>'+(env?'<span class="et ok">Enviada</span>':'<span class="et off">—</span>')+'</td>'
				+ '<td><button class="bt chico" type="button" data-pdf-hist="'+p+'|'+q+'|'+e.id+'|'+e.localId+'">PDF</button></td></tr>';
		});
	});

	abrirHoja(nuevo?'Nuevo empleado':e.nombre,
		'<div class="rejilla">'
		+ '<label class="campo"><span>Nombre completo</span><input id="f-nombre" value="'+esc(e.nombre)+'"></label>'
		+ '<label class="campo"><span>Cédula</span><input id="f-cedula" value="'+esc(e.cedula)+'" placeholder="1-2345-6789"></label>'
		+ '<label class="campo"><span>Correo</span><input id="f-correo" type="email" value="'+esc(e.correo)+'"></label>'
		+ '<label class="campo"><span>Puesto</span><input id="f-puesto" value="'+esc(e.puesto)+'"></label>'
		+ '<label class="campo"><span>Local</span><select id="f-local">'+ops+'</select></label>'
		+ '<label class="campo"><span>Fecha de ingreso</span><input id="f-ingreso" type="date" value="'+esc(e.fechaIngreso)+'"></label>'
		+ '<label class="campo"><span>Salario mensual</span><input id="f-salario" type="number" step="1000" value="'+(e.salarioMensual||'')+'"></label>'
		+ '<label class="campo"><span>Cuenta o SINPE</span><input id="f-cuenta" value="'+esc(e.cuenta)+'"></label>'
		+ '<label class="campo"><span>Estado</span><select id="f-activo">'
		+ '<option value="1"'+(e.activo!==false?' selected':'')+'>Activo</option>'
		+ '<option value="0"'+(e.activo===false?' selected':'')+'>Inactivo</option></select></label>'
		+ '</div>'
		+ (hist ? '<h3>Pagos y boletas</h3><div class="tabla-env" style="margin:0;padding:0">'
			+ '<table style="min-width:0"><thead><tr><th>Período</th><th class="n">Neto</th><th>Boleta</th><th></th></tr></thead>'
			+ '<tbody>'+hist+'</tbody></table></div>' : '')
		+ '<div class="hoja-pie"><button class="bt fuerte" type="button" id="f-guardar">Guardar</button>'
		+ '<button class="bt" type="button" id="f-cancelar">Cancelar</button></div>');

	$('#f-cancelar').onclick = cerrarHoja;
	$('#f-guardar').onclick = function(){
		var nom = $('#f-nombre').value.trim();
		if (!nom){ $('#f-nombre').focus(); return; }
		e.nombre=nom; e.cedula=$('#f-cedula').value.trim(); e.correo=$('#f-correo').value.trim();
		e.puesto=$('#f-puesto').value.trim(); e.localId=$('#f-local').value;
		e.fechaIngreso=$('#f-ingreso').value; e.salarioMensual=Number($('#f-salario').value)||0;
		e.cuenta=$('#f-cuenta').value.trim(); e.activo=$('#f-activo').value==='1';
		if (nuevo) D.empleados.push(e);
		guardar(); cerrarHoja(); pintar();
	};
}

	return { emp:e, local:localDe(localId), q:q===1?c.q1:c.q2, periodo:periodo, nq:q };
}

/* =============================================================
   6. PDF
   ============================================================= */
/* El símbolo ₡ (U+20A1) no existe en las fuentes estándar del PDF y se
   pierde al generarlo. El ¢ sí está y es el que se usa a diario en
   Costa Rica, así que dentro del PDF se escribe con ese. */
function colPdf(n){ return '¢' + Math.round(n||0).toLocaleString('es-CR'); }

function pdfBoleta(b, descargar){
	var JS = window.jspdf && window.jspdf.jsPDF;
	if (!JS){ alert('No se pudo cargar el generador de PDF. Revisá la conexión.'); return null; }
	var d = new JS({ unit:'pt', format:'letter' });
	var x = b.q, M = 56, y = 64;

	d.setFillColor(76,138,46); d.rect(0,0,612,6,'F');

	d.setFont('helvetica','bold'); d.setFontSize(15);
	d.text(nombreLocal(b.local), M, y); y += 18;
	d.setFont('helvetica','normal'); d.setFontSize(10); d.setTextColor(110);
	d.text('Comprobante de pago', M, y); y += 26;

	d.setTextColor(20);
	d.setFont('helvetica','bold'); d.setFontSize(11);
	d.text(b.emp.nombre, M, y); y += 14;
	d.setFont('helvetica','normal'); d.setFontSize(9.5); d.setTextColor(110);
	d.text('Cédula ' + (b.emp.cedula || '—') + (b.emp.puesto ? '   ·   ' + b.emp.puesto : ''), M, y); y += 13;
	d.text('Quincena ' + b.nq + '   ·   ' + diasQuincena(b.periodo, b.nq) + ' de ' + b.periodo.split('-')[0], M, y); y += 24;

	d.setDrawColor(76,138,46); d.setLineWidth(1); d.line(M, y, 612-M, y); y += 22;

	function fila(et, val, resta, negrita){
		d.setFont('helvetica', negrita ? 'bold' : 'normal'); d.setFontSize(10);
		d.setTextColor(negrita ? 20 : 70);
		d.text(et, M, y);
		if (resta) d.setTextColor(168,42,42);
		d.text((resta?'-':'') + colPdf(val), 612-M, y, { align:'right' });
		d.setTextColor(70);
		y += 17;
	}
	function regla(){ d.setDrawColor(220); d.setLineWidth(.6); d.line(M, y-11, 612-M, y-11); }

	fila('Salario de la quincena', x.base);
	if (x.montoExtra) fila(x.horas + ' horas extra', x.montoExtra);
	regla(); fila('Bruto', x.bruto, false, true); y += 6;

	fila('SEM · salud ' + D.tasas.sem + ' %', x.sem, true);
	fila('IVM · pensión ' + D.tasas.ivm + ' %', x.ivm, true);
	fila('Banco Popular ' + D.tasas.bp + ' %', x.bp, true);
	if (x.renta) fila('Impuesto sobre la renta', x.renta, true);
	if (x.adelanto) fila('Adelanto', x.adelanto, true);
	if (x.otras) fila('Otras deducciones', x.otras, true);

	y += 4; d.setDrawColor(76,138,46); d.setLineWidth(1); d.line(M, y-11, 612-M, y-11); y += 6;
	d.setFont('helvetica','bold'); d.setFontSize(13); d.setTextColor(20);
	d.text('Neto a pagar', M, y);
	d.text(colPdf(x.neto), 612-M, y, { align:'right' });

	d.setFont('helvetica','normal'); d.setFontSize(8); d.setTextColor(140);
	d.text('Las deducciones de ley se calculan sobre el salario del mes y se reparten en las dos quincenas.', M, 720);

	var nombre = 'boleta-' + (b.emp.nombre||'empleado').toLowerCase().replace(/[^a-z0-9]+/g,'-')
		+ '-' + b.periodo + '-q' + b.nq + '.pdf';
	if (descargar) d.save(nombre);
	return { doc:d, nombre:nombre };
}

function enviarTodas(){
	var locales = estado.local==='_todos'
		? D.locales.filter(function(l){return l.activo!==false;}).map(function(l){return l.id;})
		: [estado.local];
	var lista = [];
	locales.forEach(function(lid){
		empleadosDe(lid).forEach(function(e){
			var b = datosBoleta(e.id, lid, estado.periodo, estado.q);
			if (b && b.q.neto) lista.push(b);
		});
	});
	if (!lista.length) return;

	var sinCorreo = lista.filter(function(b){ return !b.emp.correo; });
	abrirHoja('Enviar ' + lista.length + ' boletas',
		'<p style="margin:0 0 var(--e4);color:var(--txt2)">Quincena '+estado.q+' · '+diasQuincena(estado.periodo,estado.q)+'</p>'
		+ (sinCorreo.length ? '<div class="aviso">'+sinCorreo.length+' sin correo: '+sinCorreo.map(function(b){return esc(b.emp.nombre);}).join(', ')+'</div>' : '')
		+ '<div class="aviso">El envío por correo se conecta cuando los datos pasen al servidor. Por ahora se descargan los PDF.</div>'
		+ '<div class="tabla-env" style="margin:0;padding:0"><table style="min-width:0"><thead><tr><th>Empleado</th><th class="n">Neto</th><th>Correo</th></tr></thead><tbody>'
		+ lista.map(function(b){
			return '<tr><td class="nombre">'+esc(b.emp.nombre)+'<small>'+esc(nombreLocal(b.local))+'</small></td>'
				+ '<td class="n">'+col(b.q.neto)+'</td>'
				+ '<td>'+(b.emp.correo?esc(b.emp.correo):'<span class="et esp">falta</span>')+'</td></tr>';
		}).join('')
		+ '</tbody></table></div>'
		+ '<div class="hoja-pie"><button class="bt fuerte" type="button" id="bajar-todas">Descargar los '+lista.length+' PDF</button>'
		+ '<button class="bt" type="button" id="e-cerrar">Cerrar</button></div>');

	$('#e-cerrar').onclick = cerrarHoja;
	$('#bajar-todas').onclick = function(){
		lista.forEach(function(b,i){ setTimeout(function(){ pdfBoleta(b, true); }, i*260); });
		var pp = per(estado.periodo, estado.local==='_todos'?locales[0]:estado.local);
		locales.forEach(function(lid){ var p=per(estado.periodo,lid); p.enviado=p.enviado||{}; p.enviado['q'+estado.q]=new Date().toISOString(); });
		guardar();
		setTimeout(function(){ cerrarHoja(); pintar(); }, lista.length*260 + 400);
	};
}

/* =============================================================
   7. PINTAR Y ESCUCHAR
   ============================================================= */
var PANTALLAS = { quincena:pantallaQuincena, empleados:pantallaEmpleados, historial:pantallaHistorial, reportes:pantallaReportes, ajustes:pantallaAjustes };

function pintar(){
	$('#sedes-env').innerHTML = selectorLocales();
	$('#lienzo').innerHTML = selectorLocalesMovil() + PANTALLAS[estado.pantalla]();
	Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function(b){
		if (b.dataset.ir===estado.pantalla) b.setAttribute('aria-current','page');
		else b.removeAttribute('aria-current');
	});
	window.scrollTo(0,0);
}
function moverMes(n){
	var a=estado.periodo.split('-'), d=new Date(Number(a[0]), Number(a[1])-1+n, 1);
	estado.periodo = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
	pintar();
}

document.addEventListener('click', function(ev){
	var t = ev.target.closest('button');
	if (!t) return;
	if (t.dataset.ir){ estado.pantalla=t.dataset.ir; pintar(); return; }
	if (t.dataset.local){ estado.local=t.dataset.local; pintar(); return; }
	if (t.dataset.q){ estado.q=Number(t.dataset.q); pintar(); return; }
	if (t.id==='mes-ant'){ moverMes(-1); return; }
	if (t.id==='mes-sig'){ moverMes(1); return; }
	if (t.id==='nuevo-emp'){ fichaEmpleado(null); return; }
	if (t.dataset.editar){ fichaEmpleado(t.dataset.editar); return; }
	if (t.dataset.boleta){ verBoleta(t.dataset.boleta, t.dataset.l, estado.periodo, estado.q); return; }
	if (t.id==='enviar-todas'){ enviarTodas(); return; }
	if (t.id==='hoja-x'){ cerrarHoja(); return; }
	if (t.dataset.pdfHist){
		var a = t.dataset.pdfHist.split('|');
		var b = datosBoleta(a[2], a[3], a[0], Number(a[1]));
		if (b) pdfBoleta(b, true);
		return;
	}
	if (t.dataset.ren){
		var l = D.locales.find(function(x){return x.id===t.dataset.ren;});
		var n = prompt('Nombre del local', nombreLocal(l));
		if (n && n.trim()){ l.nombre=n.trim(); l.grupo=null; guardar(); pintar(); }
		return;
	}
	if (t.dataset.localToggle){
		var l2 = D.locales.find(function(x){return x.id===t.dataset.localToggle;});
		if (l2){ l2.activo = l2.activo===false; guardar(); pintar(); }
		return;
	}
	if (t.id==='nuevo-local'){
		var nn = prompt('Nombre del local');
		if (nn && nn.trim()){ D.locales.push({id:'l'+Date.now(), nombre:nn.trim(), activo:true}); guardar(); pintar(); }
		return;
	}
	if (t.id==='exportar'){
		var a2 = document.createElement('a');
		a2.href = 'data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(D,null,1));
		a2.download = 'planilla-cana-brava-'+new Date().toISOString().slice(0,10)+'.json';
		a2.click(); return;
	}
	if (t.id==='importar'){
		var inp = document.createElement('input'); inp.type='file'; inp.accept='application/json';
		inp.onchange = function(){
			var f=inp.files[0]; if(!f) return;
			var r=new FileReader();
			r.onload=function(){ try{ D=JSON.parse(r.result); guardar(); pintar(); }catch(e){ alert('Ese archivo no se pudo leer.'); } };
			r.readAsText(f);
		};
		inp.click(); return;
	}
});

document.addEventListener('input', function(ev){
	var el = ev.target;
	if (el.dataset.campo){
		var fila = el.closest('tr');
		var aj = ajusteDe(estado.periodo, fila.dataset.local, fila.dataset.emp);
		aj['q'+estado.q][el.dataset.campo] = Number(el.value)||0;
		guardar();
		clearTimeout(el._t);
		el._t = setTimeout(function(){
			var campo=el.dataset.campo, emp=fila.dataset.emp;
			pintar();
			var nv = document.querySelector('tr[data-emp="'+emp+'"] input[data-campo="'+campo+'"]');
			if (nv){ nv.focus(); nv.setSelectionRange(nv.value.length, nv.value.length); }
		}, 700);
		return;
	}
	if (el.dataset.tasa){ D.tasas[el.dataset.tasa]=Number(el.value)||0; guardar(); }
});

$('#velo').onclick = cerrarHoja;
document.addEventListener('keydown', function(e){ if (e.key==='Escape') cerrarHoja(); });

pintar();
})();
</script>
